version: 2
# Dependency update reminders: at most one combined pull request per month.
# Only the Python packages the app actually runs with are tracked; nothing is
# merged or deployed automatically, and the test workflow runs on the PR.
updates:
  - package-ecosystem: pip
    directory: /DouYinSparkFlow
    schedule:
      interval: monthly
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    groups:
      # Everything (including major versions) goes into one pull request.
      all-python:
        patterns: ["*"]
    ignore:
      # The Playwright Python package must match the Playwright Docker base
      # image tag (PLAYWRIGHT_BASE_IMAGE); bump both together by hand.
      - dependency-name: playwright
      # pyee is pinned by playwright (pyee<14 for playwright 1.56); it moves
      # together with playwright, by hand.
      - dependency-name: pyee
      # The server image runs Python 3.10; these releases need Python 3.11+.
      - dependency-name: filelock
        versions: [">=4.1.1"]
      - dependency-name: starlette
        versions: [">=1.8"]
      - dependency-name: websockets
        versions: [">=17"]
